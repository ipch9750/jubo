<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1B2A4E">
<title>인평교회 주보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FAF6EE;
    --ivory-2: #F3ECDC;
    --navy: #1B2A4E;
    --navy-2: #2D4373;
    --gold: #B08A3E;
    --gold-2: #D4B26A;
    --ink: #2A2620;
    --ink-mute: #6B655A;
    --line: #E5DCC6;
    --card: #FFFFFF;
    --shadow: 0 4px 20px rgba(27,42,78,0.08);
    --radius: 14px;
    --fs-scale: 1;
  }
  [data-theme="dark"] {
    --ivory: #14171F;
    --ivory-2: #1B1F2A;
    --navy: #D4B26A;
    --navy-2: #E8CD8A;
    --gold: #D4B26A;
    --ink: #EFE9DA;
    --ink-mute: #A69E8C;
    --line: #2A2F3C;
    --card: #1F232E;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: calc(16px * var(--fs-scale)); }
  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: var(--ivory);
    color: var(--ink);
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 18px;
  }

  /* Font size controls */
  .fs-controls {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 50;
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 6px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .fs-btn {
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: background 0.2s;
  }
  .fs-btn:active, .fs-btn.active { background: var(--ivory-2); color: var(--navy); }
  .fs-btn.sm { font-size: 12px; }
  .fs-btn.md { font-size: 15px; }
  .fs-btn.lg { font-size: 18px; }
  .fs-btn.dark { font-size: 18px; }

  /* Header */
  header.masthead {
    padding: 60px 0 28px;
    text-align: center;
    border-bottom: 2px solid var(--line);
    margin-bottom: 24px;
    position: relative;
  }
  header.masthead::before {
    content: "";
    position: absolute;
    left: 50%; top: 44px;
    transform: translateX(-50%);
    width: 40px; height: 2px;
    background: var(--gold);
  }
  .church-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .service-type {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 18px;
    background: var(--navy);
    color: var(--ivory);
    font-size: 1rem;
    font-weight: 500;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  [data-theme="dark"] .service-type { background: var(--gold); color: #14171F; }
  .service-date {
    margin-top: 12px;
    font-size: 1.05rem;
    color: var(--ink-mute);
    font-weight: 500;
  }

  /* Verse card */
  .verse-card {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: var(--ivory);
    padding: 28px 22px;
    border-radius: var(--radius);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  [data-theme="dark"] .verse-card {
    background: linear-gradient(135deg, #1F232E 0%, #2A2F3C 100%);
    border: 1px solid var(--gold);
  }
  .verse-card::before {
    content: "";
    position: absolute;
    top: 10px; left: 18px;
    font-family: 'Noto Serif KR', serif;
    font-size: 4rem;
    line-height: 1;
    color: var(--gold-2);
    opacity: 0.5;
  }
  .verse-label {
    font-size: 0.82rem;
    color: var(--gold-2);
    letter-spacing: 0.15em;
    font-weight: 500;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .verse-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.2rem;
    line-height: 1.75;
    font-weight: 500;
    margin-bottom: 14px;
    text-wrap: pretty;
  }
  .verse-ref {
    font-size: 0.95rem;
    color: var(--gold-2);
    font-weight: 500;
    text-align: right;
  }

  /* Section title */
  .section-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--navy);
    margin: 32px 0 14px;
    padding-left: 12px;
    border-left: 4px solid var(--gold);
    letter-spacing: -0.01em;
  }
  [data-theme="dark"] .section-title { color: var(--gold-2); }

  /* Order list */
  .order-list {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .order-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: var(--card);
    color: inherit;
    width: 100%;
    text-align: left;
    border-left: none;
    border-right: none;
    border-top: none;
    font-family: inherit;
    font-size: inherit;
    transition: background 0.15s;
    min-height: 60px;
  }
  .order-item:last-child { border-bottom: none; }
  .order-item:active { background: var(--ivory-2); }
  .order-item[data-clickable="true"]:hover { background: var(--ivory-2); }
  .order-num {
    width: 32px; height: 32px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--ivory-2);
    color: var(--navy);
    border-radius: 50%;
    font-weight: 700;
    font-size: 0.85rem;
    font-family: 'Noto Serif KR', serif;
  }
  [data-theme="dark"] .order-num { background: #2A2F3C; color: var(--gold-2); }
  .order-body {
    flex: 1;
    min-width: 0;
  }
  .order-title {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .order-sub {
    font-size: 0.88rem;
    color: var(--ink-mute);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .order-arrow {
    color: var(--gold);
    font-size: 1.4rem;
    flex-shrink: 0;
    line-height: 1;
    opacity: 0.7;
  }
  .order-item:not([data-clickable="true"]) .order-arrow { visibility: hidden; }

  /* News accordion */
  .news-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .news-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .news-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    cursor: pointer;
    background: var(--card);
    color: inherit;
    width: 100%;
    border: none;
    font-family: inherit;
    font-size: 1.02rem;
    font-weight: 500;
    text-align: left;
    min-height: 56px;
  }
  .news-head:active { background: var(--ivory-2); }
  .news-caret {
    color: var(--gold);
    font-size: 1.2rem;
    transition: transform 0.25s;
  }
  .news-item[open] .news-caret { transform: rotate(180deg); }
  .news-body {
    display: none;
    padding: 4px 18px 18px;
    border-top: 1px solid var(--line);
  }
  .news-item[open] .news-body { display: block; }
  .news-body ul {
    list-style: none;
    padding: 8px 0 0;
  }
  .news-body li {
    padding: 8px 0 8px 20px;
    position: relative;
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--ink);
  }
  .news-body li::before {
    content: "•";
    position: absolute;
    left: 4px;
    color: var(--gold);
    font-weight: 700;
  }

  /* Account */
  .account-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .account-label {
    font-size: 0.85rem;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .account-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.01em;
    word-break: break-all;
  }
  [data-theme="dark"] .account-num { color: var(--gold-2); }
  .account-holder {
    margin-top: 4px;
    font-size: 0.95rem;
    color: var(--ink-mute);
  }
  .copy-btn {
    margin-top: 12px;
    padding: 10px 16px;
    background: var(--ivory-2);
    border: 1px solid var(--line);
    color: var(--navy);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    min-height: 44px;
  }
  .copy-btn:active { background: var(--line); }
  [data-theme="dark"] .copy-btn { color: var(--gold-2); background: #2A2F3C; }

  /* Footer */
  footer.foot {
    margin-top: 44px;
    padding: 24px 0;
    text-align: center;
    border-top: 1px solid var(--line);
  }
  .foot-links {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .foot-link {
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-mute);
    font-size: 0.9rem;
    border-radius: 8px;
    text-decoration: none;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
  }
  .foot-link:active { background: var(--ivory-2); }
  .foot-blessing {
    font-family: 'Noto Serif KR', serif;
    color: var(--ink-mute);
    font-size: 0.9rem;
    margin-top: 8px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 23, 31, 0.6);
    z-index: 100;
    display: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .modal-backdrop.show {
    display: block;
    opacity: 1;
  }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 101;
    display: none;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
  .modal.show {
    display: flex;
  }
  .modal-panel {
    background: var(--ivory);
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    border-radius: 20px 20px 0 0;
    padding: 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: auto;
  }
  .modal.show .modal-panel { transform: translateY(0); }
  .modal-header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    background: var(--ivory);
    border-radius: 20px 20px 0 0;
  }
  .modal-header::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
  }
  .modal-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--navy);
    padding-top: 6px;
  }
  [data-theme="dark"] .modal-title { color: var(--gold-2); }
  .modal-close {
    width: 40px; height: 40px;
    background: transparent;
    border: none;
    color: var(--ink-mute);
    font-size: 1.4rem;
    cursor: pointer;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .modal-close:active { background: var(--ivory-2); }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }

  /* Modal content styles */
  .hymn-header {
    text-align: center;
    padding: 16px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .hymn-number {
    display: inline-block;
    padding: 6px 14px;
    background: var(--navy);
    color: var(--ivory);
    font-size: 0.9rem;
    border-radius: 999px;
    margin-bottom: 10px;
    font-weight: 500;
  }
  [data-theme="dark"] .hymn-number { background: var(--gold); color: #14171F; }
  .hymn-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy);
  }
  [data-theme="dark"] .hymn-title { color: var(--gold-2); }
  .hymn-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--ivory-2);
    padding: 4px;
    border-radius: 10px;
  }
  .hymn-tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink-mute);
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    min-height: 42px;
  }
  .hymn-tab.active {
    background: var(--card);
    color: var(--navy);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  [data-theme="dark"] .hymn-tab.active { color: var(--gold-2); }
  .hymn-lyrics {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    line-height: 2;
    white-space: pre-wrap;
    color: var(--ink);
    padding: 8px 4px;
  }
  .hymn-score {
    text-align: center;
  }
  .hymn-score img {
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .hymn-score-placeholder {
    padding: 60px 20px;
    background: repeating-linear-gradient(
      45deg,
      var(--ivory-2),
      var(--ivory-2) 10px,
      transparent 10px,
      transparent 20px
    );
    border-radius: 12px;
    border: 2px dashed var(--line);
    color: var(--ink-mute);
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
  }
  .youtube-link {
    display: block;
    margin-top: 16px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: var(--navy);
    font-weight: 500;
    text-align: center;
  }

  /* Scripture */
  .scripture-ref {
    display: block;
    text-align: center;
    font-family: 'Noto Serif KR', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--navy);
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  [data-theme="dark"] .scripture-ref { color: var(--gold-2); }
  .scripture-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.1rem;
    line-height: 2;
    white-space: pre-wrap;
    color: var(--ink);
    text-wrap: pretty;
  }
  .scripture-text .verse-num {
    color: var(--gold);
    font-weight: 700;
    font-size: 0.85em;
    padding-right: 4px;
  }
  .external-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    padding: 14px;
    background: var(--ivory-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: var(--navy);
    font-weight: 500;
  }
  [data-theme="dark"] .external-link { color: var(--gold-2); }

  /* Sermon detail */
  .sermon-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--navy);
    text-align: center;
    padding: 12px 0 8px;
  }
  [data-theme="dark"] .sermon-title { color: var(--gold-2); }
  .sermon-preacher {
    text-align: center;
    color: var(--ink-mute);
    font-size: 0.95rem;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .sermon-scripture-label {
    font-size: 0.85rem;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .sermon-scripture-ref {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--navy);
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  [data-theme="dark"] .sermon-scripture-ref { color: var(--gold-2); }
  .outline-label {
    font-size: 0.85rem;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .outline-list {
    list-style: none;
    counter-reset: outline;
  }
  .outline-list li {
    counter-increment: outline;
    padding: 14px 14px 14px 50px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 10px;
    position: relative;
    font-size: 1.05rem;
    line-height: 1.6;
  }
  .outline-list li::before {
    content: counter(outline);
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    background: var(--navy);
    color: var(--ivory);
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.9rem;
  }
  [data-theme="dark"] .outline-list li::before { background: var(--gold); color: #14171F; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-mute);
  }

  @media print {
    .fs-controls, .foot-links, .modal, .modal-backdrop { display: none !important; }
  }
</style>
</head>
<body>

<div class="fs-controls" role="group" aria-label="글자 크기 조절">
  <button class="fs-btn sm" data-size="0.9" aria-label="작게">가</button>
  <button class="fs-btn md active" data-size="1" aria-label="보통">가</button>
  <button class="fs-btn lg" data-size="1.2" aria-label="크게">가</button>
  <button class="fs-btn dark" data-action="dark" aria-label="다크모드">◐</button>
</div>

<div class="app">
  <header class="masthead">
    <h1 class="church-name" id="churchName">인평교회</h1>
    <div class="service-type" id="serviceType">주일오전예배</div>
    <div class="service-date" id="serviceDate">2026년 9월 13일 주일</div>
  </header>

  <section class="verse-card" id="verseCard" role="button" tabindex="0" aria-label="오늘의 말씀">
    <div class="verse-label">오늘의 말씀</div>
    <p class="verse-text" id="verseText"></p>
    <div class="verse-ref" id="verseRef"></div>
  </section>

  <h2 class="section-title">예배 순서</h2>
  <div class="order-list" id="orderList">
    <div class="loading">불러오는 중...</div>
  </div>

  <h2 class="section-title">교회 소식</h2>
  <div class="news-list" id="newsList"></div>

  <h2 class="section-title">헌금 계좌</h2>
  <div class="account-card">
    <div class="account-label">계좌 안내</div>
    <div class="account-num" id="accountNum"></div>
    <div class="account-holder" id="accountHolder"></div>
    <button class="copy-btn" id="copyAccount">계좌번호 복사</button>
  </div>

  <footer class="foot">
    <div class="foot-links">
      <a href="archive.html" class="foot-link">📚 이전 주보</a>
      <a href="qr.html" class="foot-link">📱 QR 코드</a>
      <a href="edit.html" class="foot-link">✏️ 편집</a>
      <a href="print.html" class="foot-link">🖨️ 인쇄</a>
    </div>
    <div class="foot-blessing">주님의 평강이 함께하시길 🙏</div>
  </footer>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="backdrop"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // ---------- Font size / dark mode ----------
  const savedSize = localStorage.getItem('inpyeong-fs') || '1';
  const savedDark = localStorage.getItem('inpyeong-dark') === '1';
  document.documentElement.style.setProperty('--fs-scale', savedSize);
  document.querySelectorAll('.fs-btn[data-size]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.size === savedSize);
    btn.addEventListener('click', () => {
      document.documentElement.style.setProperty('--fs-scale', btn.dataset.size);
      localStorage.setItem('inpyeong-fs', btn.dataset.size);
      document.querySelectorAll('.fs-btn[data-size]').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  if (savedDark) document.documentElement.setAttribute('data-theme', 'dark');
  document.querySelector('.fs-btn[data-action="dark"]').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('inpyeong-dark', '0');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('inpyeong-dark', '1');
    }
  });

  // ---------- Modal ----------
  const backdrop = document.getElementById('backdrop');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');

  function openModal(title, html) {
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modalBody.scrollTop = 0;
    backdrop.classList.add('show');
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    backdrop.classList.remove('show');
    modal.classList.remove('show');
    document.body.style.overflow = '';
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  backdrop.addEventListener('click', closeModal);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ---------- Render helpers ----------
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function bibleGateway(ref) {
    // Convert "마태복음 6:25-34" -> external link (bskorea.or.kr, korean)
    return 'https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=6&sec=25&cVersion=GAE';
  }

  function renderHymn(item) {
    const tabs = `
      <div class="hymn-header">
        ${item.number ? `<div class="hymn-number">${esc(item.number)}</div>` : ''}
        <div class="hymn-title">${esc(item.hymnTitle || item.title)}</div>
      </div>
      <div class="hymn-tabs">
        <button class="hymn-tab active" data-tab="lyrics">가사</button>
        <button class="hymn-tab" data-tab="score">악보</button>
      </div>
      <div class="hymn-content hymn-lyrics-wrap">
        <div class="hymn-lyrics">${esc(item.lyrics || '가사가 준비되지 않았습니다.')}</div>
      </div>
      <div class="hymn-content hymn-score-wrap" style="display:none">
        ${item.score
          ? `<div class="hymn-score"><img src="${esc(item.score)}" alt="악보"></div>`
          : `<div class="hymn-score-placeholder">
              [악보 이미지 위치]<br><br>
              편집 화면에서 악보 이미지<br>URL을 넣어주세요
            </div>`}
      </div>
      ${item.youtube ? `<a href="${esc(item.youtube)}" target="_blank" rel="noopener" class="youtube-link">▶ 유튜브로 듣기</a>` : ''}
    `;
    openModal(item.title || '찬송', tabs);
    modalBody.querySelectorAll('.hymn-tab').forEach(t => {
      t.addEventListener('click', () => {
        modalBody.querySelectorAll('.hymn-tab').forEach(x => x.classList.toggle('active', x === t));
        const showLyrics = t.dataset.tab === 'lyrics';
        modalBody.querySelector('.hymn-lyrics-wrap').style.display = showLyrics ? '' : 'none';
        modalBody.querySelector('.hymn-score-wrap').style.display = showLyrics ? 'none' : '';
      });
    });
  }

  function renderScripture(item) {
    const text = String(item.text || '')
      .replace(/(^|\n)(\d+)\s/g, '$1<span class="verse-num">$2</span> ');
    const html = `
      <div class="scripture-ref">${esc(item.reference || '')}</div>
      <div class="scripture-text">${text}</div>
      <a href="${bibleGateway(item.reference)}" target="_blank" rel="noopener" class="external-link">
        📖 대한성서공회에서 보기
      </a>
    `;
    openModal(item.title || '성경 봉독', html);
  }

  function renderSermon(item, sermon) {
    const html = `
      <div class="sermon-title">${esc(sermon.title || item.content || '')}</div>
      <div class="sermon-preacher">${esc(sermon.preacher || '')}</div>
      ${sermon.scripture ? `
        <div class="sermon-scripture-label">본문</div>
        <div class="sermon-scripture-ref">${esc(sermon.scripture)}</div>
      ` : ''}
      ${(sermon.outline && sermon.outline.length) ? `
        <div class="outline-label">설교 요절</div>
        <ol class="outline-list">
          ${sermon.outline.map(o => `<li>${esc(o)}</li>`).join('')}
        </ol>
      ` : ''}
    `;
    openModal('말씀 선포', html);
  }

  function renderNews(newsData) {
    const html = newsData.map(section => `
      <div class="news-item">
        <h3 style="font-family:'Noto Serif KR',serif;color:var(--navy);font-size:1.1rem;margin-bottom:10px">
          ${esc(section.category)}
        </h3>
        <ul style="list-style:none">
          ${section.items.map(i => `
            <li style="padding:8px 0 8px 20px;position:relative;line-height:1.65">
              <span style="position:absolute;left:4px;color:var(--gold);font-weight:700">•</span>
              ${esc(i)}
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('');
    openModal('교회 소식', html || '<p style="text-align:center;color:var(--ink-mute);padding:40px">등록된 소식이 없습니다.</p>');
  }

  // ---------- Data loading ----------
  async function loadData() {
    // Priority: archive by URL param > localStorage draft > bulletin.json
    const params = new URLSearchParams(location.search);
    const archiveId = params.get('bulletin');
    if (archiveId) {
      try {
        const list = JSON.parse(localStorage.getItem('inpyeong-archive') || '[]');
        const found = list.find(x => x.id === archiveId);
        if (found && found.data) return found.data;
      } catch(e) {}
    }
    const draft = localStorage.getItem('inpyeong-bulletin-draft');
    if (draft) {
      try { return JSON.parse(draft); } catch(e) {}
    }
    try {
      const res = await fetch('data/bulletin.json?t=' + Date.now());
      return await res.json();
    } catch(e) {
      console.error('데이터 로드 실패:', e);
      return null;
    }
  }

  function summarize(item) {
    if (item.type === 'hymn') return `${item.number || ''} ${item.hymnTitle || ''}`.trim();
    if (item.type === 'scripture') return item.reference || '';
    if (item.type === 'sermon') return item.content || '';
    if (item.type === 'prayer') return item.leader || '';
    if (item.type === 'benediction') return item.leader || '';
    if (item.type === 'call') return item.content || item.leader || '';
    if (item.type === 'offering') return item.content || '';
    if (item.type === 'notice') return '아래 소식 참고';
    return '';
  }

  const CLICKABLE = new Set(['hymn', 'scripture', 'sermon', 'notice']);

  function render(data) {
    if (!data) return;
    document.getElementById('churchName').textContent = data.church.name;
    document.getElementById('serviceType').textContent = data.service.type;
    document.getElementById('serviceDate').textContent = data.service.date;
    document.getElementById('verseText').textContent = data.service.verse.text;
    document.getElementById('verseRef').textContent = data.service.verse.reference;
    document.getElementById('accountNum').textContent = `${data.church.account.bank} ${data.church.account.number}`;
    document.getElementById('accountHolder').textContent = '예금주: ' + data.church.account.holder;
    document.title = `${data.church.name} 주보 · ${data.service.date}`;

    // Order list
    const orderList = document.getElementById('orderList');
    orderList.innerHTML = '';
    data.service.order.forEach((item, i) => {
      const clickable = CLICKABLE.has(item.type);
      const btn = document.createElement('button');
      btn.className = 'order-item';
      btn.dataset.clickable = clickable ? 'true' : 'false';
      btn.innerHTML = `
        <div class="order-num">${i + 1}</div>
        <div class="order-body">
          <div class="order-title">${esc(item.title)}</div>
          <div class="order-sub">${esc(summarize(item))}</div>
        </div>
        <div class="order-arrow">›</div>
      `;
      if (clickable) {
        btn.addEventListener('click', () => {
          if (item.type === 'hymn') renderHymn(item);
          else if (item.type === 'scripture') renderScripture(item);
          else if (item.type === 'sermon') renderSermon(item, data.service.sermon || {});
          else if (item.type === 'notice') renderNews(data.news || []);
        });
      } else {
        btn.style.cursor = 'default';
      }
      orderList.appendChild(btn);
    });

    // Verse card click -> open sermon
    document.getElementById('verseCard').addEventListener('click', () => {
      renderSermon({ title: '말씀 선포' }, data.service.sermon || {});
    });

    // News list
    const newsList = document.getElementById('newsList');
    newsList.innerHTML = '';
    (data.news || []).forEach(section => {
      const item = document.createElement('details');
      item.className = 'news-item';
      item.innerHTML = `
        <summary class="news-head" style="list-style:none;cursor:pointer">
          <span>${esc(section.category)}</span>
          <span class="news-caret">▾</span>
        </summary>
        <div class="news-body">
          <ul>
            ${section.items.map(i => `<li>${esc(i)}</li>`).join('')}
          </ul>
        </div>
      `;
      newsList.appendChild(item);
    });

    // Copy account
    document.getElementById('copyAccount').addEventListener('click', async () => {
      const text = `${data.church.account.bank} ${data.church.account.number} (${data.church.account.holder})`;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('copyAccount');
        const orig = btn.textContent;
        btn.textContent = '✓ 복사되었습니다';
        setTimeout(() => btn.textContent = orig, 1600);
      } catch(e) {
        alert(text);
      }
    });
  }

  loadData().then(render);

  // Custom summary styles reset
  const s = document.createElement('style');
  s.textContent = `
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
    details[open] .news-caret { transform: rotate(180deg); }
    .news-caret { transition: transform 0.25s; }
  `;
  document.head.appendChild(s);
</script>
</body>
</html>
